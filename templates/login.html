<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky — ورود</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #87CEEB 0%, #4A90E2 50%, #1E3A8A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ابرهای تزئینی */
        body::before, body::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            filter: blur(40px);
        }
        body::before { width: 300px; height: 300px; top: -100px; left: -100px; }
        body::after { width: 400px; height: 400px; bottom: -150px; right: -150px; }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 56px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo h1 {
            color: #1E3A8A;
            font-size: 32px;
            font-weight: 700;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: all 0.3s;
            font-size: 14px;
        }

        .tab.active {
            background: white;
            color: #1E3A8A;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4A90E2, #1E3A8A);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            font-family: inherit;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(74, 144, 226, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            border-right: 4px solid #ef4444;
        }

        .error.show { display: block; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">☁️</div>
            <h1>Sky</h1>
            <p>پیامرسان آسمانی</p>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">ورود</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">ثبتنام</div>
        </div>

        <div class="error" id="error"></div>

        <div class="form-group">
            <label for="username">یوزرنیم</label>
            <input type="text" id="username" placeholder="مثلاً: ali_sky" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">پسورد</label>
            <input type="password" id="password" placeholder="حداقل ۴ کاراکتر" autocomplete="current-password">
        </div>

        <button id="submitBtn" onclick="submitForm()">ورود</button>

        <div class="footer">Sky v1.0 — ساخته شده با ❤️</div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('submitBtn').textContent = mode === 'login' ? 'ورود' : 'ثبتنام';
            document.getElementById('password').setAttribute(
                'autocomplete',
                mode === 'login' ? 'current-password' : 'new-password'
            );
            hideError();
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        async function submitForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            if (!username || !password) {
                showError('یوزرنیم و پسورد رو پر کن');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'یه لحظه...';
            hideError();

            try {
                const res = await fetch('/api/' + currentMode, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || 'خطایی رخ داد');
                    btn.disabled = false;
                    btn.textContent = currentMode === 'login' ? 'ورود' : 'ثبتنام';
                    return;
                }

                localStorage.setItem('sky_token', data.token);
                localStorage.setItem('sky_user', JSON.stringify(data.user));
                window.location.href = '/chat';

            } catch (err) {
                showError('ارتباط با سرور برقرار نشد');
                btn.disabled = false;
                btn.textContent = currentMode === 'login' ? 'ورود' : 'ثبتنام';
            }
        }

        // ارسال با Enter
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitForm();
        });
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        // اگه قبلاً لاگین کرده بود
        if (localStorage.getItem('sky_token')) {
            window.location.href = '/chat';
        }
    </script>
</body>
</html>
